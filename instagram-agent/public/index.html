<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel · Cortexis</title>
<style>body{font:15px system-ui;background:#f4f7f9;color:#0b1b28;margin:0}header{background:#07111b;color:#58d9e7;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.08em}main{max-width:900px;margin:20px auto;padding:0 16px;display:grid;gap:16px}section,.p{background:#fff;border:1px solid #d9e2e8;border-radius:10px;padding:16px}input,textarea,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #c5d1d9}textarea{width:100%;box-sizing:border-box;min-height:110px}button{background:#0b1b28;color:#fff;cursor:pointer;border:0}button.s{background:#e6edf1;color:#0b1b28}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.p{display:grid;grid-template-columns:160px 1fr;gap:14px}.p video,.p img{width:100%;border-radius:8px;background:#000}.t{font-size:12px;color:#5b6b78}@media(max-width:600px){.p{grid-template-columns:1fr}}</style>
<header><b>Cortexis · Instagram</b><form method="post" action="/logout"><button class="s">Sair</button></form></header>
<main><section><h3>Nova publicação</h3><form id="f"><input type="file" name="file" accept="video/*,image/*" required>
<label><input type="checkbox" name="story"> Story</label> <label><input type="checkbox" name="facebook" checked> Publicar também no Facebook (não vale para Story)</label><textarea name="instruction" placeholder="Sobre o que é este post? A IA escreve a legenda."></textarea>
<div class="row"><button>Criar rascunho</button><span id="m" class="t"></span></div></form></section><div id="l"></div></main><script src="/app.js"></script></html>
