<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel · Cortexis</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui;background:#f4f7f9;color:#0b1b28;margin:0}header{background:#07111b;color:#58d9e7;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.08em}main{max-width:1060px;margin:20px auto;padding:0 16px;display:grid;gap:16px}section,.p{background:#fff;border:1px solid #d9e2e8;border-radius:10px;padding:16px}input,textarea,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #c5d1d9}textarea{width:100%;box-sizing:border-box;min-height:110px}button{background:#0b1b28;color:#fff;cursor:pointer;border:0}button.s{background:#e6edf1;color:#0b1b28}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.p{display:grid;grid-template-columns:minmax(280px,360px) minmax(240px,1fr);gap:22px;align-items:start}.t{font-size:12px;color:#5b6b78}.post-preview{border:1px solid #e1e5e8;border-radius:12px;overflow:hidden;background:#fff;max-width:380px;margin:0 auto}.preview-heading{padding:12px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:650}.preview-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#07111b;color:#58d9e7;font-size:12px;letter-spacing:.04em}.preview-kind{margin-left:auto;color:#65727b;font-size:11px;font-weight:500}.preview-media{width:100%;aspect-ratio:4/5;background:#111;display:block;object-fit:contain}.preview-media.story,.preview-media.reel{aspect-ratio:9/16}.preview-actions{display:flex;gap:14px;padding:12px 12px 4px;font-size:21px;line-height:1}.preview-caption{padding:6px 12px 14px;font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.preview-caption strong{margin-right:5px}.preview-platforms{padding:10px 12px;border-top:1px solid #edf0f2;display:flex;gap:8px;flex-wrap:wrap}.platform-chip{font-size:11px;color:#40505c;border:1px solid #dce3e7;border-radius:999px;padding:4px 8px}.preview-title{font-size:12px;color:#54636d;margin:0 0 8px}.preview-note{font-size:11px;line-height:1.4;color:#687780;margin:8px 0 0}.editor-area{min-width:0}.editor-area textarea{margin-top:12px}.status-line{margin:8px 0}

</style>

<label><input type="checkbox" name="story"> Story</label> <label><input type="checkbox" name="facebook" checked> Publicar também no Facebook (não vale para Story)</label><textarea name="instruction" placeholder="Sobre o que é este post? A IA escreve a legenda."></textarea>
